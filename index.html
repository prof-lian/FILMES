    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            position: relative; min-height: 100vh;

        /* grade e pontinhos, igual ao site de aulas */
        body::before {
            content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;

                linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
            background-size: 42px 42px;
        }
        body::after {
            content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(circle at 8px 8px, rgba(255,255,255,.15) 2px, transparent 2.5px) 0 0/42px 42px,
                radial-gradient(circle at 900px 200px, rgba(255,255,255,.06) 0, transparent 60%);
        }
        header, .hero, main, footer { position: relative; z-index: 1; }

        header { display: flex; align-items: center; justify-content: space-between; padding: 2vh 2.4vw; flex-wrap: wrap; gap: 10px; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; }
        .titulo-wrap { display: flex; align-items: center; gap: 12px; }
        .emoji-pc { font-size: 34px; }
        .brand h1 { margin: 0; font-size: 27px; font-weight: 700; }
        .brand p { margin: 3px 0 0; opacity: .85; font-size: 14px; font-weight: 500; }

        .hero { text-align: center; padding: 0 20px 1.6vh; }
        .hero h2 { font-size: clamp(18px, 2.6vw, 28px); margin: 0; font-weight: 700; }
        .hero p { margin: 6px 0 0; font-size: 14px; opacity: .8; }

        main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 2.4vw 3vh; }

        .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
        .search {
            flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px;
            background: #fff; border-radius: 18px; padding: 0 16px; color: #123a6b;
        }
        .search input { flex: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; padding: 14px 0; color: #123a6b; }
        .search input::placeholder { color: #123a6b; opacity: .5; }
        .filters { display: flex; gap: 8px; }
        .chip {
            font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; color: #fff;
            background: transparent; border: 2px solid #fff; border-radius: 8px; padding: 0 16px; transition: .2s;
        }
        .chip:hover, .chip.active { background: #fff; color: #123a6b; }

        .table-container {
            background: #fff; color: #123a6b; border-radius: 18px; overflow: hidden; overflow-x: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
        }
        table { width: 100%; border-collapse: collapse; }
        thead th { text-align: left; background: #123a6b; color: #fff; font-size: 14px; letter-spacing: .5px; text-transform: uppercase; padding: 15px 20px; }
        td { padding: 14px 20px; border-bottom: 1px solid #e3eaf5; font-size: 15px; }
        tbody tr { transition: background .2s; }
        tbody tr:hover { background: #eef4fc; }
        .movie-title { font-weight: 800; }
        .dur { opacity: .7; white-space: nowrap; }

        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; color: #fff; white-space: nowrap; }
        .badge.livre { background: #2e9e57; }
        .badge.dez { background: #e69500; }

        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-watch {
            font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
            color: #fff; background: #123a6b; border: none; border-radius: 8px; padding: 7px 14px;
            transition: .2s transform, .2s box-shadow, .2s background;
        }
        .btn-watch:hover { background: #1b5aa6; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.3); }

        .empty { display: none; text-align: center; padding: 30px; color: #123a6b; opacity: .7; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,.92); justify-content: center; align-items: center; }
        .modal-content { position: relative; width: 92%; max-width: 1000px; height: 80%; background: #000; border-radius: 14px; border: 3px solid #fff; }
        .close-btn { position: absolute; top: -44px; right: 0; color: #fff; font-size: 36px; line-height: 1; cursor: pointer; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 11px; }

        .site-footer { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 10px 12px 14px; }
        .foot-msg { font-size: 15px; }
        .foot-fixed { font-size: 11px; opacity: .6; line-height: 1.5; }

        @media (max-width: 640px) { th, td { padding: 12px; } .filters { width: 100%; } .chip { flex: 1; padding: 10px; } .brand h1 { font-size: 22px; } }
    </style>
</head>

            const tr = document.createElement('tr');
            let btns = `<div class="btn-group">`;
            m.links.forEach(link => { btns += `<button class="btn-watch" data-url="${link.u}">▶ ${link.l}</button>`; });
            btns += `</div>`;
            tr.innerHTML = `
                <td><div class="movie-title">${m.title}</div></td>
                <td class="dur">${m.dur}</td>
                <td><span class="badge ${m.rC}">${m.rat === 'L' ? 'Livre' : m.rat + ' anos'}</span></td>
                <td>${btns}</td>`;
            tbody.appendChild(tr);
        });
        emptyEl.style.display = list.length ? 'none' : 'block';
    }

    tbody.addEventListener('click', e => { const b = e.target.closest('.btn-watch'); if (b) openModal(b.dataset.url); });
    document.getElementById('search').addEventListener('input', e => { query = e.target.value; render(); });
    document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
        c.classList.add('active'); filter = c.dataset.f; render();
    }));

    function openModal(u) {
        if (u.includes('folders') || u.includes('photos')) { window.open(u, '_blank'); return; }
        document.getElementById('videoFrame').src = u.replace(/\/view(\?.*)?/, '/preview');
        document.getElementById('videoModal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('videoModal').style.display = 'none';
        document.getElementById('videoFrame').src = '';
    }
    window.onclick = e => { if (e.target == document.getElementById('videoModal')) closeModal(); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    render();
</script>
</body>
</html>
